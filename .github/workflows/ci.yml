# Builds the whole solution and runs the tests on every pull request and every push to the default branch.
# No Revit is needed: the add-in projects compile against the Revit 2025 API reference packages.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # pushes to other branches are checked through their pull request, so they don't run twice
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (core, engine, launcher, tests, SurveyLab)
        run: dotnet build SurveyToRevit.sln -c Release

      - name: Tests
        run: dotnet test SurveyToRevit.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/
          retention-days: 14
